name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App 版本号（如 1.0.0）'
        required: false
        default: '1.0.0'
      version_code:
        description: 'App 版本码（整数，每次更新递增）'
        required: false
        default: '1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VNAME="${GITHUB_REF#refs/tags/v}"
            VCODE="${GITHUB_RUN_NUMBER}"
          else
            VNAME="${{ inputs.version_name }}"
            VCODE="${{ inputs.version_code }}"
          fi
          echo "version_name=${VNAME:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VCODE:-1}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept pre-installed Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install Capacitor dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Sync web assets and generate Android project
        working-directory: app
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          node scripts/sync-web.mjs
          npx cap add android

      - name: Decode optional release keystore
        id: signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$(pwd)/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Android manifest, icons & version
        working-directory: app
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
        run: |
          node scripts/configure-android.mjs
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.has_keystore }}" = "true" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../milk-v${{ steps.ver.outputs.version_name }}.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../milk-v${{ steps.ver.outputs.version_name }}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: milk-android-v${{ steps.ver.outputs.version_name }}
          path: app/milk-v${{ steps.ver.outputs.version_name }}.apk
          retention-days: 30

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/milk-v${{ steps.ver.outputs.version_name }}.apk
          generate_release_notes: true
