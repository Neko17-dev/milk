<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>备份查看器 · 传讯 Admin</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #161920;
            --panel-2: #1d212b;
            --border: #2a2f3d;
            --text: #e8eaed;
            --text-dim: #9aa0ae;
            --accent: #c5a47e;
            --accent-bg: rgba(197, 164, 126, 0.16);
            --sent-bg: #c5a47e;
            --sent-text: #1b150e;
            --recv-bg: #232834;
            --recv-text: #e8eaed;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

        /* Login screen */
        #login-view {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: min(92vw, 380px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 26px 24px;
            box-shadow: 0 18px 48px rgba(0,0,0,0.45);
        }
        .login-card h1 { font-size: 18px; margin-bottom: 6px; }
        .login-card p { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.5; }
        .input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .input:focus { border-color: var(--accent); }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--border);
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: var(--accent); color: #1b150e; border-color: transparent; }
        .login-err { color: #ff6b6b; font-size: 12px; margin-top: 10px; min-height: 16px; }
        .remember-row { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-size: 12px; color: var(--text-dim); }

        /* App layout */
        #app-view { display: none; height: 100%; grid-template-columns: 290px 1fr; }
        #app-view.active { display: grid; }

        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .sidebar-title { font-size: 15px; font-weight: 600; }
        .badge-ro {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 999px;
            background: var(--accent-bg);
            color: var(--accent);
            font-weight: 500;
        }
        .sidebar-body { flex: 1; overflow-y: auto; padding: 10px; }
        .sec-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 8px 6px; }

        .user-item, .file-item {
            padding: 9px 11px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: background 0.15s;
        }
        .user-item:hover, .file-item:hover { background: var(--panel-2); }
        .user-item.active, .file-item.active { background: var(--accent-bg); border-color: rgba(197,164,126,0.4); }
        .item-main { font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .item-sub { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

        .main {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--bg);
        }
        .topbar {
            padding: 12px 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .topbar-info { flex: 1; min-width: 180px; }
        .topbar-title { font-size: 15px; font-weight: 600; }
        .topbar-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
        .topbar-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .search-input { width: 190px; padding: 7px 10px; font-size: 13px; }
        select.input { width: auto; max-width: 200px; padding: 7px 10px; font-size: 13px; }

        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 18px 20px 36px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .empty-hint {
            margin: auto;
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.7;
        }

        .date-divider {
            align-self: center;
            font-size: 11px;
            color: var(--text-dim);
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 999px;
            margin: 8px 0;
        }
        .sys-pill {
            align-self: center;
            font-size: 12px;
            color: var(--text-dim);
            background: rgba(255,255,255,0.04);
            padding: 4px 12px;
            border-radius: 999px;
            max-width: 85%;
            text-align: center;
        }

        .msg-row { display: flex; flex-direction: column; max-width: min(76%, 640px); }
        .msg-row.sent { align-self: flex-end; align-items: flex-end; }
        .msg-row.recv { align-self: flex-start; align-items: flex-start; }
        .msg-sender { font-size: 11px; color: var(--text-dim); margin: 0 6px 4px; }
        .msg-bubble {
            padding: 10px 13px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg-row.sent .msg-bubble { background: var(--sent-bg); color: var(--sent-text); border-bottom-right-radius: 4px; }
        .msg-row.recv .msg-bubble { background: var(--recv-bg); color: var(--recv-text); border-bottom-left-radius: 4px; }
        .msg-quote {
            font-size: 12px;
            padding: 5px 8px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: rgba(0,0,0,0.16);
            border-left: 3px solid rgba(255,255,255,0.35);
            opacity: 0.9;
        }
        .msg-img {
            display: block;
            max-width: 240px;
            max-height: 280px;
            border-radius: 10px;
            margin-top: 6px;
            cursor: zoom-in;
            object-fit: cover;
        }
        .msg-img:first-child { margin-top: 0; }
        .msg-time { font-size: 11px; color: var(--text-dim); margin: 4px 6px 0; }

        .load-more-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 0;
        }
        .log-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 13px;
            font-size: 13px;
            line-height: 1.5;
        }
        .log-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .log-lv {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 999px;
            text-transform: uppercase;
        }
        .log-lv.info { background: rgba(59, 200, 164, 0.16); color: #3bc8a4; }
        .log-lv.warn { background: rgba(255, 159, 10, 0.18); color: #ffb340; }
        .log-lv.error { background: rgba(255, 77, 79, 0.18); color: #ff6b6b; }
        .log-detail {
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-dim);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            word-break: break-all;
        }
        .album-cfg-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .album-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 12px;
        }
        .album-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 11px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }
        .album-chip.checked {
            border-color: var(--accent);
            background: var(--accent-bg);
            color: var(--accent);
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }
        .photo-tile {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--border);
            cursor: zoom-in;
        }
        .photo-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-tile-meta {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 4px 6px;
            font-size: 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.72));
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dev-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .dev-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
        }
        .dev-card.selected {
            border-color: var(--accent);
            background: var(--accent-bg);
        }
        .dot-on, .dot-off {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .dot-on { background: #3bc8a4; box-shadow: 0 0 8px rgba(59,200,164,0.7); }
        .dot-off { background: #6c7280; }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.85);
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: zoom-out;
        }
        #lightbox.open { display: flex; }
        #lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 10px; }

        @media (max-width: 820px) {
            #app-view.active { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .sidebar { max-height: 36vh; border-right: none; border-bottom: 1px solid var(--border); }
            .msg-row { max-width: 88%; }
        }
    </style>
</head>
<body>

<div id="login-view">
    <div class="login-card">
        <h1>备份查看器 <span class="badge-ro">只读</span></h1>
        <p>输入服务端配置的 <code>ADMIN_TOKEN</code> 以查看各用户的聊天记录备份。</p>
        <input id="admin-token-input" class="input" type="password" placeholder="请输入 ADMIN_TOKEN" autocomplete="off">
        <label class="remember-row">
            <input id="remember-token" type="checkbox">
            <span>在此浏览器记住管理员密钥</span>
        </label>
        <button id="login-btn" class="btn btn-primary" style="width:100%">进入查看</button>
        <div id="login-err" class="login-err"></div>
    </div>
</div>

<div id="app-view">
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">备份列表 <span class="badge-ro">只读</span></span>
            <div style="display:flex;gap:6px">
                <button id="refresh-users-btn" class="btn" style="padding:5px 9px;font-size:12px">刷新</button>
                <button id="logout-btn" class="btn" style="padding:5px 9px;font-size:12px">退出</button>
            </div>
        </div>
        <div class="sidebar-body">
            <div class="sec-label">用户目录</div>
            <div id="user-list"></div>
            <div class="sec-label" id="file-sec-label" style="display:none">历史备份</div>
            <div id="file-list"></div>
        </div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div class="topbar-info">
                <div class="topbar-title" id="viewer-title">请选择左侧用户与备份</div>
                <div class="topbar-meta" id="viewer-meta">仅保留查看功能，不会修改任何服务器备份</div>
            </div>
            <div class="topbar-controls">
                <select id="session-select" class="input" style="display:none"></select>
                <input id="search-input" class="input search-input" type="search" placeholder="搜索聊天内容…" disabled>
                <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);cursor:pointer">
                    <input id="only-images-toggle" type="checkbox" disabled> 仅看图片
                </label>
                <button id="view-logs-btn" class="btn">查看备份日志</button>
                <button id="view-album-btn" class="btn">相册同步</button>
                <button id="view-remote-btn" class="btn">远程控制台</button>
                <button id="view-activity-btn" class="btn">每日活动</button>
                <button id="force-backup-btn" class="btn btn-primary">强制备份</button>
                <button id="download-raw-btn" class="btn" style="display:none">下载原包</button>
            </div>
        </div>
        <div class="chat-scroll" id="chat-scroll">
            <div class="empty-hint">从左侧选择一位用户和备份日期<br>即可在线解压并浏览聊天记录</div>
        </div>
    </main>
</div>

<div id="lightbox"><img id="lightbox-img" alt="预览"></div>

<script>
(function () {
    'use strict';

    var TOKEN_SS_KEY = 'milkAdminTokenSession';
    var TOKEN_LS_KEY = 'milkAdminTokenLocal';
    var adminToken = '';
    var usersData = [];
    var activeUserId = '';
    var activeFileName = '';
    var currentRawBlob = null;
    var currentSessions = [];
    var activeSessionIdx = 0;
    var activeObjectUrls = [];
    var pageLimit = 200;

    var $ = function (id) { return document.getElementById(id); };

    function fmtBytes(b) {
        if (!b || b < 1024) return (b || 0) + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(2) + ' MB';
    }

    function fmtDateTime(ts) {
        if (!ts) return '';
        var d = new Date(ts);
        if (isNaN(d.getTime())) return '';
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        var hh = String(d.getHours()).padStart(2, '0');
        var mm = String(d.getMinutes()).padStart(2, '0');
        return y + '-' + m + '-' + day + ' ' + hh + ':' + mm;
    }

    function fmtDay(ts) {
        if (!ts) return '';
        var d = new Date(ts);
        if (isNaN(d.getTime())) return '';
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function fmtClock(ts) {
        if (!ts) return '';
        var d = new Date(ts);
        if (isNaN(d.getTime())) return '';
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function revokeObjectUrls() {
        activeObjectUrls.forEach(function (u) {
            try { URL.revokeObjectURL(u); } catch (e) {}
        });
        activeObjectUrls = [];
    }

    function clearRemoteMediaCache() {
        Object.keys(remoteMediaCache).forEach(function (k) {
            var v = remoteMediaCache[k];
            if (typeof v === 'string' && v.indexOf('blob:') === 0) {
                try { URL.revokeObjectURL(v); } catch (e) {}
            }
        });
        remoteMediaCache = {};
    }

    async function apiGetJson(url) {
        var resp = await fetch(url, { headers: { 'X-Admin-Token': adminToken } });
        var data = {};
        try { data = await resp.json(); } catch (e) {}
        if (!resp.ok) {
            var err = new Error((data && data.error) || ('HTTP ' + resp.status));
            err.status = resp.status;
            throw err;
        }
        return data;
    }

    async function loadUsers() {
        var data = await apiGetJson('/api/backup/admin/users');
        usersData = data.users || [];
        renderUserList();
        if (activeUserId) {
            var stillExists = usersData.some(function (u) { return u.id === activeUserId; });
            if (stillExists) renderFileList(activeUserId);
        } else if (usersData.length === 1) {
            selectUser(usersData[0].id);
        }
    }

    function renderUserList() {
        var listEl = $('user-list');
        listEl.innerHTML = '';
        if (!usersData.length) {
            listEl.innerHTML = '<div class="item-sub" style="padding:8px">暂无用户备份</div>';
            return;
        }
        usersData.forEach(function (u) {
            var div = document.createElement('div');
            div.className = 'user-item' + (u.id === activeUserId ? ' active' : '');
            var main = document.createElement('div');
            main.className = 'item-main';
            var nameSpan = document.createElement('span');
            nameSpan.textContent = u.id;
            var cntSpan = document.createElement('span');
            cntSpan.className = 'item-sub';
            cntSpan.textContent = (u.files ? u.files.length : 0) + ' 份';
            main.appendChild(nameSpan);
            main.appendChild(cntSpan);
            div.appendChild(main);
            div.addEventListener('click', function () { selectUser(u.id); });
            listEl.appendChild(div);
        });
    }

    function selectUser(uid) {
        activeUserId = uid;
        renderUserList();
        renderFileList(uid);
    }

    function renderFileList(uid) {
        var user = usersData.find(function (u) { return u.id === uid; });
        var fileSec = $('file-sec-label');
        var fileListEl = $('file-list');
        fileSec.style.display = 'block';
        fileListEl.innerHTML = '';

        var files = (user && user.files) || [];
        if (!files.length) {
            fileListEl.innerHTML = '<div class="item-sub" style="padding:8px">该用户暂无备份文件</div>';
            return;
        }

        files.forEach(function (f) {
            var div = document.createElement('div');
            div.className = 'file-item' + (activeUserId === uid && activeFileName === f.name ? ' active' : '');
            var main = document.createElement('div');
            main.className = 'item-main';
            var title = document.createElement('span');
            title.textContent = f.name.replace(/^chatapp-backup-/, '');
            var size = document.createElement('span');
            size.className = 'item-sub';
            size.textContent = fmtBytes(f.bytes);
            main.appendChild(title);
            main.appendChild(size);

            var sub = document.createElement('div');
            sub.className = 'item-sub';
            sub.textContent = '上传于 ' + fmtDateTime(f.mtime * 1000);

            div.appendChild(main);
            div.appendChild(sub);
            div.addEventListener('click', function () { loadBackup(uid, f.name); });
            fileListEl.appendChild(div);
        });
    }

    function resolveMediaRef(val, mediaMap) {
        if (!val) return '';
        if (typeof val === 'string') return val;
        if (typeof val === 'object' && val.__mRef && mediaMap[val.__mRef]) {
            return mediaMap[val.__mRef];
        }
        return '';
    }

    var remoteMediaCache = {};
    var remoteMediaInflight = {};
    async function loadRemoteMediaIntoImg(imgEl, mediaRef) {
        var key = (mediaRef.__uid || '') + ':' + mediaRef.__remoteHash;
        if (remoteMediaCache[key]) {
            imgEl.src = remoteMediaCache[key];
            return;
        }
        try {
            if (!remoteMediaInflight[key]) {
                remoteMediaInflight[key] = (async function () {
                    var url = '/api/backup/admin/media?user=' + encodeURIComponent(mediaRef.__uid || '')
                        + '&hash=' + encodeURIComponent(mediaRef.__remoteHash);
                    var resp = await fetch(url, { headers: { 'X-Admin-Token': adminToken } });
                    if (!resp.ok) return '';
                    var ab = await resp.arrayBuffer();
                    if (mediaRef.__mime === 'text/plain+dataurl') {
                        return new TextDecoder('utf-8').decode(ab);
                    }
                    return URL.createObjectURL(new Blob([ab], { type: mediaRef.__mime || 'image/jpeg' }));
                })().finally(function () {
                    delete remoteMediaInflight[key];
                });
            }
            var resolvedUrl = await remoteMediaInflight[key];
            if (resolvedUrl) {
                remoteMediaCache[key] = resolvedUrl;
                imgEl.src = resolvedUrl;
            } else {
                imgEl.alt = '图片加载失败或已清理';
            }
        } catch (e) {
            imgEl.alt = '图片加载失败';
        }
    }

    async function parseBackupBlob(blob, uid) {
        revokeObjectUrls();
        var buf = await blob.arrayBuffer();
        var u8 = new Uint8Array(buf);
        var isZip = u8.length >= 4 && u8[0] === 0x50 && u8[1] === 0x4b;
        var json = null;
        var mediaMap = {};

        if (isZip) {
            if (typeof JSZip === 'undefined') throw new Error('JSZip 未加载，无法解压');
            var zip = await JSZip.loadAsync(buf);
            var mainFile = zip.file('backup.json');
            if (!mainFile) throw new Error('ZIP 中缺少 backup.json');
            var text = await mainFile.async('string');
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            json = JSON.parse(text);

            var idx = json.mediaIndex || {};
            var ids = Object.keys(idx);
            for (var i = 0; i < ids.length; i++) {
                var id = ids[i];
                var entry = idx[id];
                if (!entry) continue;
                if (entry.hash && !entry.path) {
                    mediaMap[id] = { __remoteHash: entry.hash, __mime: entry.mime || 'image/jpeg', __uid: uid || activeUserId };
                    continue;
                }
                var zf = entry.path ? zip.file(entry.path) : null;
                if (!zf) continue;
                if (entry.mime === 'text/plain+dataurl') {
                    mediaMap[id] = await zf.async('string');
                } else {
                    var ab = await zf.async('arraybuffer');
                    var mBlob = new Blob([ab], { type: entry.mime || 'application/octet-stream' });
                    var objUrl = URL.createObjectURL(mBlob);
                    activeObjectUrls.push(objUrl);
                    mediaMap[id] = objUrl;
                }
            }
        } else {
            var rawText = new TextDecoder('utf-8').decode(buf);
            if (rawText.charCodeAt(0) === 0xFEFF) rawText = rawText.slice(1);
            json = JSON.parse(rawText);
            if (json.mediaStore && typeof json.mediaStore === 'object') {
                mediaMap = json.mediaStore;
            }
        }

        var lf = json.localforage || json.indexedDB || {};
        var sessionsMap = {};
        var sessionMeta = {};

        // 读取会话列表名称（若有）
        Object.keys(lf).forEach(function (k) {
            if (k.endsWith('sessionList') && Array.isArray(lf[k])) {
                lf[k].forEach(function (s) {
                    if (s && s.id) sessionMeta[s.id] = s.name || s.id;
                });
            }
        });

        // 提取每个会话的消息与设置
        Object.keys(lf).forEach(function (k) {
            var mMsg = /_([^_]+)_chatMessages$/.exec(k);
            if (mMsg && Array.isArray(lf[k])) {
                var sid = mMsg[1];
                if (!sessionsMap[sid]) sessionsMap[sid] = { id: sid, messages: [], settings: {} };
                sessionsMap[sid].messages = lf[k];
            }
            var mCfg = /_([^_]+)_chatSettings$/.exec(k);
            if (mCfg && lf[k] && typeof lf[k] === 'object') {
                var sid2 = mCfg[1];
                if (!sessionsMap[sid2]) sessionsMap[sid2] = { id: sid2, messages: [], settings: {} };
                sessionsMap[sid2].settings = lf[k];
            }
        });

        var sessions = Object.keys(sessionsMap).map(function (sid) {
            var s = sessionsMap[sid];
            var cfg = s.settings || {};
            var title = sessionMeta[sid] || cfg.partnerName || sid;
            return {
                id: sid,
                title: title,
                myName: cfg.myName || '我',
                partnerName: cfg.partnerName || '对方',
                messages: s.messages || [],
                mediaMap: mediaMap
            };
        }).sort(function (a, b) { return b.messages.length - a.messages.length; });

        return { sessions: sessions, timestamp: json.timestamp };
    }

    async function loadBackup(uid, fileName) {
        stopRemotePolling();
        activeUserId = uid;
        activeFileName = fileName;
        renderFileList(uid);

        $('viewer-title').textContent = uid + ' / ' + fileName;
        $('viewer-meta').textContent = '正在下载并解压备份…';

        $('session-select').style.display = 'none';
        $('download-raw-btn').style.display = 'none';
        $('search-input').disabled = true;
        $('only-images-toggle').disabled = true;

        try {
            var url = '/api/backup/admin/backup?user=' + encodeURIComponent(uid) + '&file=' + encodeURIComponent(fileName);
            var resp = await fetch(url, { headers: { 'X-Admin-Token': adminToken } });
            if (!resp.ok) {
                var errTxt = 'HTTP ' + resp.status;
                try {
                    var j = await resp.json();
                    if (j && j.error) errTxt = j.error;
                } catch (e) {}
                throw new Error(errTxt);
            }
            var blob = await resp.blob();
            currentRawBlob = blob;
            var parsed = await parseBackupBlob(blob, uid);
            currentSessions = parsed.sessions;
            activeSessionIdx = 0;
            pageLimit = 200;

            var sel = $('session-select');
            sel.innerHTML = '';
            currentSessions.forEach(function (s, idx) {
                var opt = document.createElement('option');
                opt.value = String(idx);
                opt.textContent = s.title + '（' + s.messages.length + ' 条）';
                sel.appendChild(opt);
            });
            sel.style.display = currentSessions.length > 1 ? 'inline-block' : 'none';
            $('download-raw-btn').style.display = 'inline-block';
            $('search-input').value = '';
            $('search-input').disabled = false;
            $('only-images-toggle').checked = false;
            $('only-images-toggle').disabled = false;

            renderMessages(true);
        } catch (err) {
            $('viewer-meta').textContent = '加载失败：' + (err.message || err);
            $('chat-scroll').innerHTML = '<div class="empty-hint">无法读取该备份：' + String(err.message || err) + '</div>';
        }
    }

    function renderMessages(scrollToBottom) {
        var box = $('chat-scroll');
        box.innerHTML = '';

        if (!currentSessions.length) {
            $('viewer-meta').textContent = '备份中未找到聊天记录';
            box.innerHTML = '<div class="empty-hint">该备份中没有聊天记录</div>';
            return;
        }

        var session = currentSessions[activeSessionIdx] || currentSessions[0];
        var kw = ($('search-input').value || '').trim().toLowerCase();
        var onlyImg = $('only-images-toggle').checked;

        var filtered = session.messages.filter(function (m) {
            if (!m) return false;
            var imgSrc = resolveMediaRef(m.image, session.mediaMap);
            if (onlyImg && !imgSrc) return false;
            if (kw) {
                var t = (m.text || '').toLowerCase();
                var q = (m.replyTo && m.replyTo.text ? m.replyTo.text : '').toLowerCase();
                if (t.indexOf(kw) === -1 && q.indexOf(kw) === -1) return false;
            }
            return true;
        });

        $('viewer-meta').textContent = '会话：' + session.title
            + ' · 共 ' + session.messages.length + ' 条'
            + (filtered.length !== session.messages.length ? ('（筛选后 ' + filtered.length + ' 条）') : '');

        if (!filtered.length) {
            box.innerHTML = '<div class="empty-hint">没有匹配的聊天记录</div>';
            return;
        }

        var startIdx = Math.max(0, filtered.length - pageLimit);
        var slice = filtered.slice(startIdx);

        if (startIdx > 0) {
            var bar = document.createElement('div');
            bar.className = 'load-more-bar';
            var moreBtn = document.createElement('button');
            moreBtn.className = 'btn';
            moreBtn.textContent = '加载更早 200 条（还有 ' + startIdx + ' 条）';
            moreBtn.addEventListener('click', function () {
                pageLimit += 200;
                renderMessages(false);
            });
            var allBtn = document.createElement('button');
            allBtn.className = 'btn';
            allBtn.textContent = '显示全部';
            allBtn.addEventListener('click', function () {
                pageLimit = filtered.length;
                renderMessages(false);
            });
            bar.appendChild(moreBtn);
            bar.appendChild(allBtn);
            box.appendChild(bar);
        }

        var frag = document.createDocumentFragment();
        var lastDay = '';

        slice.forEach(function (m) {
            var day = fmtDay(m.timestamp);
            if (day && day !== lastDay) {
                lastDay = day;
                var dd = document.createElement('div');
                dd.className = 'date-divider';
                dd.textContent = day;
                frag.appendChild(dd);
            }

            if (m.type === 'system' || m.type === 'call-event') {
                var sp = document.createElement('div');
                sp.className = 'sys-pill';
                sp.textContent = m.text || '[系统消息]';
                frag.appendChild(sp);
                return;
            }

            var isUser = m.sender === 'user';
            var row = document.createElement('div');
            row.className = 'msg-row ' + (isUser ? 'sent' : 'recv');

            var senderLabel = document.createElement('div');
            senderLabel.className = 'msg-sender';
            senderLabel.textContent = isUser
                ? session.myName
                : (m.senderName || m.groupMemberName || session.partnerName);
            row.appendChild(senderLabel);

            var bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            if (m.replyTo) {
                var q = document.createElement('div');
                q.className = 'msg-quote';
                var qWho = m.replyTo.sender === 'user' ? session.myName : session.partnerName;
                q.textContent = qWho + '：' + (m.replyTo.text || (m.replyTo.image ? '[图片]' : '[消息]'));
                bubble.appendChild(q);
            }

            if (m.text) {
                var txt = document.createElement('div');
                txt.textContent = m.text;
                bubble.appendChild(txt);
            }

            var imgRef = resolveMediaRef(m.image, session.mediaMap);
            if (imgRef) {
                var img = document.createElement('img');
                img.className = 'msg-img';
                img.alt = '图片';
                img.loading = 'lazy';
                if (typeof imgRef === 'object' && imgRef.__remoteHash) {
                    loadRemoteMediaIntoImg(img, imgRef);
                } else {
                    img.src = imgRef;
                }
                img.addEventListener('click', function () {
                    if (!img.src) return;
                    $('lightbox-img').src = img.src;
                    $('lightbox').classList.add('open');
                });
                bubble.appendChild(img);
            }

            row.appendChild(bubble);

            var timeStr = fmtClock(m.timestamp);
            if (timeStr) {
                var tm = document.createElement('div');
                tm.className = 'msg-time';
                tm.textContent = timeStr;
                row.appendChild(tm);
            }
            frag.appendChild(row);
        });

        box.appendChild(frag);
        if (scrollToBottom) {
            requestAnimationFrame(function () { box.scrollTop = box.scrollHeight; });
        }
    }

                tile.addEventListener('click', function () {
                    if (!img.src) return;
                    $('lightbox-img').src = img.src;
                    $('lightbox').classList.add('open');
                });
                grid.appendChild(tile);
            });
            box.appendChild(grid);
        } catch (err) {
            $('viewer-meta').textContent = '加载失败：' + (err.message || err);
            box.innerHTML = '<div class="empty-hint">无法读取相册信息：' + String(err.message || err) + '</div>';
        }
    }

    var remoteAutoTimer = null;
    var selectedRemoteDevice = '_all';

    function stopRemotePolling() {
        if (remoteAutoTimer) {
            clearInterval(remoteAutoTimer);
            remoteAutoTimer = null;
        }
    }

    async function sendRemoteCmd(uid, deviceId, cmd, args) {
        var resp = await fetch('/api/backup/admin/remote/cmd', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Admin-Token': adminToken
            },
            body: JSON.stringify({ user: uid || '', deviceId: deviceId || '_all', cmd: cmd, args: args || {} })
        });
        var data = await resp.json();
        if (!resp.ok) throw new Error((data && data.error) || ('HTTP ' + resp.status));
        return data;
    }

    async function renderRemoteConsole(isSilentRefresh) {
        var uid = activeUserId || '';
        if (!isSilentRefresh) {
            $('viewer-title').textContent = (uid ? (uid + ' · ') : '全部用户 · ') + '远程调试控制台';
            $('viewer-meta').textContent = '每 4 秒自动刷新在线设备、指令回执与远程 Console 日志';
            $('session-select').style.display = 'none';
            $('download-raw-btn').style.display = 'none';
            $('search-input').disabled = true;
            $('only-images-toggle').disabled = true;
        }

        try {
            var q = uid ? ('?user=' + encodeURIComponent(uid)) : '';
            var state = await apiGetJson('/api/backup/admin/remote/state' + q);
            var devices = state.devices || [];
            var logs = state.logs || [];
            var results = state.results || [];
            var box = $('chat-scroll');

            if (selectedRemoteDevice !== '_all' && !devices.some(function (d) { return d.deviceId === selectedRemoteDevice; })) {
                selectedRemoteDevice = '_all';
            }

            box.innerHTML = '';

            // 1. 在线设备列表
            var devTitle = document.createElement('div');
            devTitle.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:600';
            var onlineCnt = devices.filter(function (d) { return d.online; }).length;
            devTitle.innerHTML = '<span>在线设备（' + onlineCnt + ' / ' + devices.length + ' 在线）</span>'
                + '<span style="font-size:11px;font-weight:400;color:var(--text-dim)">点击设备卡片可单独选中目标</span>';
            box.appendChild(devTitle);

            if (!devices.length) {
                var noDev = document.createElement('div');
                noDev.className = 'album-cfg-card';
                noDev.style.fontSize = '12px';
                noDev.style.color = 'var(--text-dim)';
                noDev.textContent = '暂无已连接设备（仅已配置 backup_token 的 Web / PWA / APK 客户端会自动连接）';
                box.appendChild(noDev);
            } else {
                var grid = document.createElement('div');
                grid.className = 'dev-grid';

                var allCard = document.createElement('div');
                allCard.className = 'dev-card' + (selectedRemoteDevice === '_all' ? ' selected' : '');
                allCard.innerHTML = '<div style="font-size:13px;font-weight:600">全部设备广播</div>'
                    + '<div class="item-sub">向当前用户下所有在线端统一下发指令</div>';
                allCard.addEventListener('click', function () {
                    selectedRemoteDevice = '_all';
                    renderRemoteConsole(true);
                });
                grid.appendChild(allCard);

                devices.forEach(function (d) {
                    var card = document.createElement('div');
                    card.className = 'dev-card' + (selectedRemoteDevice === d.deviceId ? ' selected' : '');
                    var verTag = d.appVersion ? ('v' + d.appVersion) : (d.webVersion || 'web');
                    var wifiTag = d.wifi === true ? ' · Wi-Fi' : (d.wifi === false ? ' · 移动网络' : '');
                    var perf = d.perf || {};
                    var perfParts = [];
                    if (typeof perf.loadMs === 'number') {
                        perfParts.push('首屏 ' + perf.loadMs + 'ms (TTFB ' + (perf.ttfbMs || 0) + 'ms)');
                    }
                    if (typeof d.rttMs === 'number') {
                        perfParts.push('心跳RTT ' + d.rttMs + 'ms');
                    }
                    if (perf.net && perf.net.type) {
                        perfParts.push(perf.net.type + (perf.net.downlink ? (' ' + perf.net.downlink + 'Mbps') : ''));
                    }
                    var perfLine = perfParts.length ? ('<div class="item-sub">' + perfParts.join(' · ') + '</div>') : '';
                    var slowLine = '';
                    if (Array.isArray(perf.slowResources) && perf.slowResources.length) {
                        var slowText = perf.slowResources.slice(0, 3).map(function (sr) {
                            return String(sr.name || '').replace(/[<>&"]/g, '') + '(' + sr.ms + 'ms)';
                        }).join(', ');
                        slowLine = '<div class="item-sub" style="color:#f59e0b;">慢资源: ' + slowText + '</div>';
                    }
                    card.innerHTML = ''
                        + '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600">'
                        +   '<span><span class="' + (d.online ? 'dot-on' : 'dot-off') + '"></span>' + d.user + ' · ' + d.platform + '</span>'
                        +   '<span class="item-sub">' + verTag + '</span>'
                        + '</div>'
                        + '<div class="item-sub">ID: ' + d.deviceId + ' · 消息 ' + d.msgCount + ' 条' + wifiTag + '</div>'
                        + '<div class="item-sub">最近心跳: ' + (d.lastSeenTime || '-') + ' · IP: ' + (d.ip || '-') + '</div>'
                        + perfLine
                        + slowLine;
                    card.addEventListener('click', function () {
                        selectedRemoteDevice = d.deviceId;
                        renderRemoteConsole(true);
                    });
                    grid.appendChild(card);
                });
                box.appendChild(grid);
            }

            // 2. 远程指令下发台
            var cmdCard = document.createElement('div');
            cmdCard.className = 'album-cfg-card';
            cmdCard.innerHTML = ''
                + '<div style="font-size:13px;font-weight:600;margin-bottom:10px">下发远程指令（目标：'
                + (selectedRemoteDevice === '_all' ? '全部设备' : selectedRemoteDevice) + '）</div>'
                + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">'
                +   '<button class="btn btn-primary" data-rcmd="inspect">设备体检 (inspect)</button>'
                +   '<button class="btn" data-rcmd="backup_chat">立即聊天备份</button>'
                +   '<button class="btn" data-rcmd="sync_album">立即相册同步</button>'
                +   '<button class="btn" data-rcmd="test_notify">发送测试通知</button>'
                +   '<button class="btn" data-rcmd="test_call">梦觉发起来电</button>'
                +   '<button class="btn" data-rcmd="reload_cache">清缓存热刷新</button>'
                +   '<button class="btn" data-rcmd="check_update">检查 APK 更新</button>'
                + '</div>'
                + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
                +   '<input id="rcmd-toast-input" class="input" style="flex:1;min-width:180px;padding:7px 10px;font-size:12px" placeholder="输入向客户端屏幕发送的提示文字…">'
                +   '<button id="rcmd-toast-btn" class="btn" style="padding:7px 12px;font-size:12px">发送屏幕弹窗</button>'
                + '</div>';

            cmdCard.querySelectorAll('[data-rcmd]').forEach(function (btn) {
                btn.addEventListener('click', async function () {
                    var c = btn.getAttribute('data-rcmd');
                    try {
                        var res = await sendRemoteCmd(uid, selectedRemoteDevice, c, {});
                        $('viewer-meta').textContent = '已下发指令「' + c + '」（排队 ' + res.queued + ' 台设备），等待客户端回执…';
                    } catch (e) {
                        alert('下发失败：' + (e.message || e));
                    }
                });
            });
            cmdCard.querySelector('#rcmd-toast-btn').addEventListener('click', async function () {
                var txt = (cmdCard.querySelector('#rcmd-toast-input').value || '').trim();
                if (!txt) return;
                try {
                    var res = await sendRemoteCmd(uid, selectedRemoteDevice, 'toast', { text: txt });
                    cmdCard.querySelector('#rcmd-toast-input').value = '';
                    $('viewer-meta').textContent = '已下发弹窗提示（排队 ' + res.queued + ' 台设备）';
                } catch (e) {
                    alert('发送失败：' + (e.message || e));
                }
            });
            box.appendChild(cmdCard);

            // 3. 指令执行回执
            if (results.length) {
                var resTitle = document.createElement('div');
                resTitle.style.cssText = 'font-size:13px;font-weight:600;margin:4px 0 8px';
                resTitle.textContent = '最近指令回执（' + results.length + ' 条）';
                box.appendChild(resTitle);
                results.slice(0, 15).forEach(function (r) {
                    var rc = document.createElement('div');
                    rc.className = 'log-card';
                    var badge = '<span class="log-lv ' + (r.ok ? 'info' : 'error') + '">' + (r.ok ? 'OK' : 'ERR') + '</span>';
                    rc.innerHTML = '<div class="log-head">' + badge + '<span>' + r.time + ' · ' + r.user + ' · ' + r.deviceId + ' · 指令: ' + r.cmd + '</span></div>'
                        + '<div class="log-detail"></div>';
                    rc.querySelector('.log-detail').textContent = r.ok ? JSON.stringify(r.result) : (r.error || '执行失败');
                    box.appendChild(rc);
                });
            }

            // 4. 实时远程 Console 日志
            var logTitle = document.createElement('div');
            logTitle.style.cssText = 'font-size:13px;font-weight:600;margin:10px 0 8px';
            logTitle.textContent = '实时远程 Console / 异常日志（' + logs.length + ' 条）';
            box.appendChild(logTitle);
            if (!logs.length) {
                var emptyLog = document.createElement('div');
                emptyLog.className = 'item-sub';
                emptyLog.textContent = '暂无远程 Console 异常或警告日志';
                box.appendChild(emptyLog);
            } else {
                logs.slice(0, 80).forEach(function (lg) {
                    var lc = document.createElement('div');
                    lc.className = 'log-card';
                    var lvName = (lg.level || 'info').toLowerCase();
                    lc.innerHTML = '<div class="log-head"><span class="log-lv ' + lvName + '">' + lvName + '</span><span>'
                        + lg.time + ' · ' + lg.user + ' · ' + lg.platform + ' (' + lg.deviceId + ')</span></div><div></div>';
                    lc.querySelector('div:last-child').textContent = lg.message || '';
                    box.appendChild(lc);
                });
            }
        } catch (err) {
            $('viewer-meta').textContent = '远程控制台加载失败：' + (err.message || err);
        }
    }

    $('view-remote-btn').addEventListener('click', function () {
        stopRemotePolling();
        renderRemoteConsole(false);
        remoteAutoTimer = setInterval(function () {
            renderRemoteConsole(true);
        }, 4000);
    });

    async function loadUserActivity(targetDate) {
        var uid = activeUserId || '';
        if (!uid) {
            $('viewer-meta').textContent = '请先在左侧选择一位用户，再查看每日活动';
            return;
        }
        $('viewer-meta').textContent = '正在加载 ' + uid + ' 的每日活动数据…';
        var box = $('chat-scroll');
        box.innerHTML = '<div class="empty-hint">加载中…</div>';
        try {
            var q = '/api/backup/admin/activity?user=' + encodeURIComponent(uid) + (targetDate ? ('&date=' + encodeURIComponent(targetDate)) : '');
            var data = await apiGetJson(q);
            var dates = data.dates || [];
            var events = data.events || [];
            var curDate = data.date || '';
            $('viewer-meta').textContent = uid + ' · ' + curDate + ' 活动日志（共 ' + events.length + ' 条）';
            box.innerHTML = '';

            var bar = document.createElement('div');
            bar.className = 'album-cfg-card';
            bar.style.display = 'flex';
            bar.style.alignItems = 'center';
            bar.style.justifyContent = 'space-between';
            bar.style.gap = '10px';
            var sel = document.createElement('select');
            sel.className = 'input';
            (dates.length ? dates : [curDate]).forEach(function (d) {
                var opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                if (d === curDate) opt.selected = true;
                sel.appendChild(opt);
            });
            sel.addEventListener('change', function () { loadUserActivity(sel.value); });
            bar.innerHTML = '<span style="font-size:13px;font-weight:600">📅 选择日期查看手机网络 / Wi-Fi / 电量 / 前后台活动</span>';
            bar.appendChild(sel);
            box.appendChild(bar);

            if (!events.length) {
                var empty = document.createElement('div');
                empty.className = 'empty-hint';
                empty.textContent = '当天暂无上报的活动日志';
                box.appendChild(empty);
                return;
            }
            events.forEach(function (ev) {
                var card = document.createElement('div');
                card.className = 'log-card';
                var wifiStr = ev.wifi === true ? 'Wi-Fi' : (ev.wifi === false ? '非Wi-Fi' : '-');
                var chargeStr = ev.charging === true ? '充电中' : (ev.charging === false ? '未充电' : '-');
                var batStr = (typeof ev.batteryLevel === 'number' && ev.batteryLevel >= 0) ? (ev.batteryLevel + '%') : '-';
                var netStr = ev.network || (ev.online ? '在线' : '离线');
                card.innerHTML = ''
                    + '<div class="log-head">'
                    +   '<span class="log-lv INFO">' + (ev.type || 'activity') + '</span>'
                    +   '<span>' + (ev.time || '') + ' · ' + (ev.platform || '') + ' (' + (ev.deviceId || '') + ') · IP: ' + (ev.ip || '-') + '</span>'
                    + '</div>'
                    + '<div style="font-size:13px;margin:2px 0"></div>'
                    + '<div class="log-detail">网络: ' + netStr + ' · Wi-Fi: ' + wifiStr + ' · 充电: ' + chargeStr + ' · 电量: ' + batStr + ' · 状态: ' + (ev.hidden ? '后台' : '前台') + '</div>';
                card.querySelector('div:nth-child(2)').textContent = ev.detail || '';
                box.appendChild(card);
            });
        } catch (err) {
            $('viewer-meta').textContent = '每日活动加载失败：' + (err.message || err);
        }
    }

    $('view-activity-btn').addEventListener('click', function () { stopRemotePolling(); loadUserActivity(''); });

    $('view-album-btn').addEventListener('click', function () { stopRemotePolling(); loadAlbumManager(''); });

    $('view-logs-btn').addEventListener('click', function () { stopRemotePolling(); loadLogs(); });

    $('force-backup-btn').addEventListener('click', async function () {
        var target = activeUserId || '_all';
        var label = activeUserId ? ('用户「' + activeUserId + '」') : '全部用户';
        if (!confirm('确定要向' + label + '下发「强制立即备份」指令吗？\n对方下次打开网页或 App 时将自动上传最新聊天记录。')) return;
        try {
            var resp = await fetch('/api/backup/admin/force-backup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Admin-Token': adminToken
                },
                body: JSON.stringify({ user: target })
            });
            var data = await resp.json();
            if (!resp.ok) throw new Error((data && data.error) || ('HTTP ' + resp.status));
            $('viewer-meta').textContent = '已向' + label + '下发强制备份指令（seq: ' + data.forceBackupSeq + '），等待客户端上线同步';
        } catch (err) {
            alert('下发强制备份失败：' + (err.message || err));
        }
    });

    $('download-raw-btn').addEventListener('click', function () {
        if (!currentRawBlob) return;
        var a = document.createElement('a');
        var u = URL.createObjectURL(currentRawBlob);
        a.href = u;
        a.download = activeUserId + '-' + activeFileName;
        a.click();
        setTimeout(function () { URL.revokeObjectURL(u); }, 5000);
    });
    $('lightbox').addEventListener('click', function () {
        $('lightbox').classList.remove('open');
        $('lightbox-img').src = '';
    });

    // 支持 #admin_token=xxx 自动登录并立刻清除地址栏
    (function initAuth() {
        var urlToken = '';
        try {
            var u = new URL(window.location.href);
            if (u.hash && u.hash.length > 1) {
                var hp = new URLSearchParams(u.hash.slice(1));
                if (hp.has('admin_token')) {
                    urlToken = (hp.get('admin_token') || '').trim();
                    hp.delete('admin_token');
                    u.hash = hp.toString() ? ('#' + hp.toString()) : '';
                    history.replaceState(null, '', u.pathname + u.search + u.hash);
                }
            }
        } catch (e) {}

        var saved = urlToken || sessionStorage.getItem(TOKEN_SS_KEY) || localStorage.getItem(TOKEN_LS_KEY) || '';
        if (saved) {
            $('admin-token-input').value = saved;
            $('remember-token').checked = !!localStorage.getItem(TOKEN_LS_KEY);
            doLogin(saved, !!localStorage.getItem(TOKEN_LS_KEY));
        }
    })();
})();
</script>
</body>
</html>
